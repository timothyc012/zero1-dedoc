name: Publish Python SDK

# sdk/python 을 PyPI 에 게시한다. 태그 python-vX.Y.Z 를 push 하면 돈다.
# PyPI 신뢰 게시(trusted publishing, 토큰 없음): PyPI 프로젝트 kordoc 에
# 게시자 chrisryugj/kordoc · publish-python.yml · 환경 pypi 가 등록돼 있어야 한다.
on:
  push:
    tags: ["python-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: 태그·pyproject·__version__ 버전 일치 확인
        working-directory: sdk/python
        run: |
          tag="${GITHUB_REF_NAME#python-v}"
          proj=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mod=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/kordoc/__init__.py)
          echo "tag=$tag pyproject=$proj __version__=$mod"
          test "$tag" = "$proj" && test "$tag" = "$mod"
      - name: wheel·sdist 빌드
        working-directory: sdk/python
        run: |
          python -m pip install build
          python -m build -o "$GITHUB_WORKSPACE/pydist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pydist
          path: pydist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pydist
          path: pydist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: pydist/
